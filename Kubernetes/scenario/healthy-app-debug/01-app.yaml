apiVersion: v1
kind: Namespace
metadata:
  name: latency-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-code
  namespace: latency-lab
data:
  server.py: |
    import os, random, time, http.server, socketserver

    SLOW = float(os.environ.get("SLOW_PERCENT", "0"))
    DELAY = float(os.environ.get("SLOW_DELAY", "5"))

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok"
            elif self.path == "/cpu":
                sum(i * i for i in range(2_000_000))   # CPU-heavy work
                body = ("cpu done by %s\n" % os.environ.get("HOSTNAME")).encode()
            else:
                if random.random() * 100 < SLOW:
                    time.sleep(DELAY)
                body = ("served by %s\n" % os.environ.get("HOSTNAME")).encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    class S(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True

    S(("", 8080), H).serve_forever()
---
# 2 healthy replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-good
  namespace: latency-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop, version: good }
  template:
    metadata:
      labels: { app: shop, version: good }
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/code/server.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /code
      volumes:
        - name: code
          configMap:
            name: server-code
---
# 1 replica that stalls 5s on ~50% of requests (passes health checks!)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-slow
  namespace: latency-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop, version: slow }
  template:
    metadata:
      labels: { app: shop, version: slow }
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/code/server.py"]
          env:
            - name: SLOW_PERCENT
              value: "50"
            - name: SLOW_DELAY
              value: "5"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /code
      volumes:
        - name: code
          configMap:
            name: server-code
---
# The "load balancer": a Service spreading traffic over all 3 pods
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: latency-lab
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8080
---
# Debug/client pod used to generate traffic
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: latency-lab
spec:
  containers:
    - name: toolbox
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]