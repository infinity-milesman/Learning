# Infrastructure-level fault: healthy app, but a tiny CPU limit throttles it under load
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
  namespace: latency-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: cpu-app }
  template:
    metadata:
      labels: { app: cpu-app }
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/code/server.py"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 100m }
            limits: { cpu: 100m }
          volumeMounts:
            - name: code
              mountPath: /code
      volumes:
        - name: code
          configMap:
            name: server-code
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-app
  namespace: latency-lab
spec:
  selector:
    app: cpu-app
  ports:
    - port: 80
      targetPort: 8080